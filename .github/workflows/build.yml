name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BuildConfiguration: Release
  Solution: src\TomsToolbox.sln

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Log DotNet version
      run: dotnet --info

    - name: Restore Solution
      run: dotnet restore ${{ env.Solution }}

    - name: Build Solution
      run: dotnet build ${{ env.Solution }} --configuration ${{ env.BuildConfiguration }} --no-restore

    - name: Publish Sample App
      run: dotnet publish -c ${{ env.BuildConfiguration }} --no-build src\SampleApp.Ninject\SampleApp.Ninject.csproj

    - name: Run Tests
      run: dotnet test ${{ env.Solution }} --configuration ${{ env.BuildConfiguration }} --no-build

    - name: Publish Artifact Packages
      uses: actions/upload-artifact@v7
      with:
        name: Packages
        path: Deploy/*.*

    - name: Publish Artifact Sample
      uses: actions/upload-artifact@v7
      with:
        name: Sample
        path: |
          src/Publish/*.*
          !src/Publish/*.xml

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Verify tag matches version
      shell: pwsh
      run: |
        $version = ([xml](Get-Content src\Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
        $tag = '${{ github.ref_name }}' -replace '^v', ''
        if (-not $version) { throw 'Version not found in Directory.Build.props' }
        if ($tag -ne $version) { throw "Tag '$tag' does not match version '$version' in Directory.Build.props" }
        "PackageVersion=$version" >> $env:GITHUB_ENV

    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        name: Packages
        path: packages

    - name: NuGet login (OIDC)
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push packages to nuget.org
      shell: pwsh
      run: |
        $packages = Get-ChildItem packages -Filter "*.$env:PackageVersion.nupkg"
        if (-not $packages) { throw "No packages found for version $env:PackageVersion" }
        foreach ($p in $packages) {
          dotnet nuget push $p.FullName --api-key '${{ steps.login.outputs.NUGET_API_KEY }}' --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "Push failed: $($p.Name)" }
        }
