name: Build

on:
  push:
  pull_request:

env:
  BuildConfiguration: Release
  Solution: src\TomsToolbox.sln

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Log DotNet version
      run: dotnet --info

    - name: Restore Solution
      run: dotnet restore ${{ env.Solution }}

    - name: Build Solution
      run: dotnet build ${{ env.Solution }} --configuration ${{ env.BuildConfiguration }} --no-restore

    - name: Publish Sample App
      run: dotnet publish -c ${{ env.BuildConfiguration }} --no-build src\SampleApp.Ninject\SampleApp.Ninject.csproj

    - name: Run Tests
      run: dotnet test ${{ env.Solution }} --configuration ${{ env.BuildConfiguration }} --no-build

    - name: Publish Artifact Packages
      uses: actions/upload-artifact@v7
      with:
        name: Packages
        path: Deploy/*.*

    - name: Publish Artifact Sample
      uses: actions/upload-artifact@v7
      with:
        name: Sample
        path: |
          src/Publish/*.*
          !src/Publish/*.xml
